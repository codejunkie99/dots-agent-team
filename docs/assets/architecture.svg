<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1700" viewBox="0 0 640 1700" role="img" aria-labelledby="title desc">
<title id="title">Dots agent team — control, evidence and verification</title>
<desc id="desc">Approved source excerpts flow to a coordinating dot in a Codex host. The host asks Jev for bounded model, memory and computer-action choices, validates confidence and approvals, and launches separate CLI workers. Workers call Model Router with discovered IDs. An independent reviewer checks the author result; the host verifies evidence and persists tasks, results and versioned local memory. Optional computer use needs a fresh observation, Jev selection, actual host driver execution and a checked postcondition. Dashed arrows show control or recall; solid arrows show approved data and results. The unchanged official dots product-page icon identifies the service only. This is an independent integration with no implied OpenAI affiliation.</desc>
<defs>
  <style>
    :root{color-scheme:light dark}
    .bg{fill:#f4f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.inner{fill:#f4f7fb;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#142337}.muted{fill:#4c6078}.blue{fill:#2556bf}.teal{fill:#086e68}
    text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .title{font-size:34px;font-weight:700;letter-spacing:-.7px}.heading{font-size:28px;font-weight:650;letter-spacing:-.35px}.body{font-size:23px}.small{font-size:20px}.tiny{font-size:18px}
    .data{fill:none;stroke:#087d74;stroke-width:3}.control{fill:none;stroke:#3167d0;stroke-width:3;stroke-dasharray:8 6}.arrow-data{fill:#087d74}.arrow-control{fill:#3167d0}
    @media(prefers-color-scheme:dark){.bg{fill:#0f1724}.card{fill:#172335;stroke:#35465f}.inner{fill:#101c2b;stroke:#35465f}.ink{fill:#eef3fb}.muted{fill:#b5c5db}.blue{fill:#9abbff}.teal{fill:#75dfcf}.data{stroke:#75dfcf}.control{stroke:#9abbff}.arrow-data{fill:#75dfcf}.arrow-control{fill:#9abbff}}
  </style>
  <marker id="dataEnd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path class="arrow-data" d="M0 0L8 4L0 8Z"/></marker>
  <marker id="controlEnd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path class="arrow-control" d="M0 0L8 4L0 8Z"/></marker>
</defs>
<rect class="bg" width="640" height="1700" rx="24"/>
<text class="title ink" x="32" y="58">Dots agent team</text>
<text class="body muted" x="32" y="94">One coordinator. Bounded, verified work.</text>
<path class="control" d="M34 121H78"/><text class="small blue" x="90" y="128">Control / recall</text>
<path class="data" d="M330 121H374"/><text class="small teal" x="386" y="128">Evidence / results</text>

<rect class="card" x="32" y="158" width="576" height="140" rx="20"/>
<text class="heading ink" x="56" y="200">1  Approved inputs</text>
<text class="body muted" x="56" y="238">Selected excerpts · task · budget</text>
<text class="small muted" x="56" y="270">Source text is evidence, never permission.</text>
<path class="data" d="M320 298V328" marker-end="url(#dataEnd)"/>

<rect class="card" x="32" y="336" width="576" height="202" rx="20"/>
<g transform="translate(60 360)"><svg xmlns="http://www.w3.org/2000/svg" width="81" height="81" viewBox="0 0 81 81" fill="none"><path d="M40.0391 0C62.152 0 80.0781 17.9261 80.0781 40.0391C80.0781 62.152 62.152 80.0781 40.0391 80.0781C17.9261 80.0781 0 62.152 0 40.0391C0 17.9261 17.9261 0 40.0391 0ZM40.0391 24.1992C31.2907 24.1992 24.1992 31.2907 24.1992 40.0391C24.1992 48.7874 31.2907 55.8789 40.0391 55.8789C48.7874 55.8789 55.8789 48.7874 55.8789 40.0391C55.8789 31.2907 48.7874 24.1992 40.0391 24.1992Z" fill="#BAC1D3"/></svg></g>
<text class="heading ink" x="168" y="389">2  dot in a Codex host</text>
<text class="body muted" x="168" y="425">Coordinator + executor</text>
<text class="body muted" x="56" y="478">Lean roles · scopes · approvals · cost</text>
<text class="small muted" x="56" y="513">Preserves progress and tool permissions.</text>
<path class="control" d="M282 538V568" marker-end="url(#controlEnd)"/>
<path class="control" d="M358 568V545" marker-end="url(#controlEnd)"/>

<rect class="card" x="32" y="576" width="576" height="150" rx="20"/>
<text class="heading ink" x="56" y="620">Jev: select bounded choices</text>
<text class="body muted" x="56" y="660">Model · memory action · computer action</text>
<text class="small muted" x="56" y="696">Host gates confidence; Jev does not execute.</text>
<path class="control" d="M320 726V756" marker-end="url(#controlEnd)"/>

<rect class="card" x="32" y="764" width="576" height="370" rx="20"/>
<text class="heading ink" x="56" y="806">3  Separate CLI processes</text>
<rect class="inner" x="56" y="832" width="240" height="96" rx="14"/>
<text class="body ink" x="74" y="867">Draft / analysis</text><text class="small muted" x="74" y="901">Scoped job → result</text>
<rect class="inner" x="56" y="964" width="240" height="106" rx="14"/>
<text class="body ink" x="74" y="1000">Independent review</text><text class="small muted" x="74" y="1034">Own model request</text>
<path class="data" d="M176 928V956" marker-end="url(#dataEnd)"/>
<rect class="inner" x="364" y="832" width="220" height="238" rx="14"/>
<text class="body ink" x="382" y="878">Model Router</text><text class="small muted" x="382" y="925">Discovered IDs</text><text class="small muted" x="382" y="964">Authenticated</text><text class="small muted" x="382" y="1003">Responses API</text>
<path class="data" d="M296 866H356" marker-end="url(#dataEnd)"/><path class="data" d="M364 899H304" marker-end="url(#dataEnd)"/>
<path class="data" d="M296 998H356" marker-end="url(#dataEnd)"/><path class="data" d="M364 1033H304" marker-end="url(#dataEnd)"/>
<text class="small muted" x="56" y="1110">Host checks quotes, files and acceptance.</text>
<path class="data" d="M320 1134V1164" marker-end="url(#dataEnd)"/>

<rect class="card" x="32" y="1172" width="576" height="176" rx="20"/>
<text class="heading ink" x="56" y="1216">4  Durable local workspace</text>
<text class="body muted" x="56" y="1254">Sources · tasks · leases · result notes</text>
<text class="body muted" x="56" y="1288">Host memory: write / retrieve / update</text>
<text class="small muted" x="56" y="1320">Versions, expiry and conflict checks.</text>
<path class="control" d="M608 1250H626V448H609" marker-end="url(#controlEnd)"/>

<rect class="card" x="32" y="1392" width="576" height="186" rx="20"/>
<text class="heading ink" x="56" y="1436">Optional: computer use</text>
<text class="body muted" x="56" y="1475">Fresh state → Jev choice → host action</text>
<text class="body muted" x="56" y="1509">Existing driver executes and re-observes.</text>
<text class="small muted" x="56" y="1546">Check postcondition. Missing driver: stop.</text>
<path class="control" d="M608 495H616V1368H320V1384" marker-end="url(#controlEnd)"/>

<text class="small muted" x="32" y="1622">Independent integration · dots icon © OpenAI</text>
<text class="tiny muted" x="32" y="1654">Service identification only. No endorsement implied.</text>
</svg>